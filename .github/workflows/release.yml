name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version to publish, matching the application (e.g. v1.0.0)'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - id: version
        name: Validate tag against both application versions
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: python scripts/validate_release.py "$RELEASE_TAG" --check-git-tag
  windows:
    needs: validate
    uses: ./.github/workflows/build-windows.yml
  publish:
    needs: [validate, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      RELEASE_PRERELEASE: ${{ needs.validate.outputs.prerelease }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pcb-diff-windows-x64
          path: release-assets
      - name: Verify every published checksum
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Prepare a draft release and attach validated deliverables
        env:
          RELEASE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')
            if [ "$draft" != true ]; then
              echo 'Refusing to replace an already-published release. Bump the version.'
              exit 1
            fi
          else
            args=(--draft --target "$RELEASE_SHA" --title "PCB Diff $RELEASE_TAG" --generate-notes)
            if [ "$RELEASE_PRERELEASE" = true ]; then args+=(--prerelease); fi
            gh release create "$RELEASE_TAG" "${args[@]}"
          fi
          gh release upload "$RELEASE_TAG" release-assets/* --clobber
      - name: Publish the completed release
        run: gh release edit "$RELEASE_TAG" --draft=false
