name: Build portable Windows executables

on:
  workflow_call:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install runtime and build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Check pip dependency consistency
        run: python -m pip check
      - name: Test, freeze, check both executables, and package
        run: python scripts/build_windows.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pcb-diff-windows-x64
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

